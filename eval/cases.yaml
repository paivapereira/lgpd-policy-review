# eval/cases.yaml
# Catálogo MÁQUINA-LEGÍVEL dos casos de avaliação, consumido por
# eval/harness/run_engine_cases.py. A tabela humana (com os quatro campos do
# Classifier, cláusula governante, regra, construtibilidade) está em
# docs/eval/test-cases-proposal.md — este arquivo é a destilação executável.
#
# Campos por caso:
#   id                 - identificador do caso
#   desc               - descrição de uma linha
#   policy_root        - eval-lgpd | eval-gdpr   (qual raiz sob policies/ carregar)
#   mode               - single | sweep              (single check_applicability OU sweep de todas active)
#   clause_id          - cláusula avaliada (mode: single)
#   structured_context - INPUT da tool check_applicability (nomes da tool:
#                        data_categories, operation, legal_basis, destination)
#   classifier_fields  - os QUATRO campos do Classifier (nomes do Classifier:
#                        operation_type, data_categories, declared_legal_basis,
#                        declared_transformations) — doc/realismo; o harness usa
#                        structured_context (projeção rename já aplicada).
#   expected_verdict   - desfecho esperado (compliant|violation_candidate|
#                        indeterminate|not_applicable|coverage_gap)
#   pr                 - caminho do código sintético (quando há)
#   engine_runnable    - true (harness executa) | false (pipeline-only: precisa do modelo)

cases:
  # ---------------------------------------------------------------- compliant
  - id: COMP-001
    desc: "Coleta de identificacao com consentimento declarado -> compliant."
    policy_root: eval-lgpd
    mode: single
    clause_id: POL-005
    structured_context:
      data_categories: [dados_de_identificacao]
      operation: collection
      legal_basis: consent
    classifier_fields:
      operation_type: collection
      data_categories: [dados_de_identificacao]
      declared_legal_basis: consent
      declared_transformations: []
    expected_verdict: compliant
    pr: prs/COMP-001_identificacao_consent
    engine_runnable: true

  # -------------------------------------------------------- violation_candidate
  - id: VIOL-001
    desc: "Coleta de identificacao SEM base legal -> violation_candidate (omissao). Vitrine E2E."
