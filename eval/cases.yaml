      data_categories: [dados_de_identificacao]
      operation: collection
      # legal_basis ausente de proposito
    classifier_fields:
      operation_type: collection
      data_categories: [dados_de_identificacao]
      declared_legal_basis: null
      declared_transformations: []
    expected_verdict: violation_candidate
    pr: prs/VIOL-001_identificacao_sem_base
    engine_runnable: true

  - id: VIOL-002
