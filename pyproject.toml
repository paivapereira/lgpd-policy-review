[project]
name = "mcp-servers"
version = "0.1.0"
description = "MCP servers for the LGPD Data Protection Policy code review system"
authors = [
    { name = "João Guilherme de Mello Paiva Pereira", email = "106413206+paivapereira@users.noreply.github.com" }
]
requires-python = ">=3.12.7"
dependencies = [
    "fastmcp>=3.2.0,<4.0",
    "packaging>=24",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.13",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Recognizer pack fixtures são deliberadamente type-incorrect pelo padrão
# stdlib (logger.info com kwargs estilo structured logging) — o snippet é
# alvo de detecção Semgrep em T07, não código de aplicação. Excluído do
# strict checking; semantic correctness é validada pela regra Semgrep que
# casa o pattern, não por mypy.
exclude = [
    "tests/mcp_servers/semgrep_runner/fixtures/recognizers_pack_br/",
]
